# Proyecto Tríada: 3 backends Flask detrás de Nginx (round robin).
name: triada

# Bloque común de los backends (ancla YAML): cada backend lo reutiliza con <<: *backend.
x-backend: &backend
  build: ./backend
  restart: unless-stopped
  networks:
    - so-net
  cpus: 0.5          # techo de CPU por backend
  mem_limit: 256m    # techo de memoria por backend
  # La imagen no tiene curl: el healthcheck usa Python.
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
    interval: 5s
    timeout: 3s
    retries: 5
    start_period: 5s

services:
  backend1:
    <<: *backend
    environment:
      INSTANCE_ID: "1"

  backend2:
    <<: *backend
    environment:
      INSTANCE_ID: "2"

  backend3:
    <<: *backend
    environment:
      INSTANCE_ID: "3"

  # Proxy inverso. Único servicio con puerto publicado (8080 del host -> 80).
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # Nginx arranca solo cuando los tres backends están sanos.
    depends_on:
      backend1:
        condition: service_healthy
      backend2:
        condition: service_healthy
      backend3:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - so-net

  # ---------- Fase 2: monitoreo ----------

  # Prometheus: recolecta las métricas cada 5 s y las guarda 7 días en prometheus_data.
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - so-net

  # Traduce el stub_status de Nginx (8081, interno) al formato de Prometheus (9113).
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    command:
      - --nginx.scrape-uri=http://nginx:8081/stub_status
    depends_on:
      - nginx
    restart: unless-stopped
    networks:
      - so-net

  # cAdvisor: CPU, memoria, red y disco de cada contenedor.
  # Los volúmenes son de solo lectura; privileged y /dev/kmsg los pide cAdvisor en Docker Desktop.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    command:
      - --docker_only=true
    privileged: true
    devices:
      - /dev/kmsg
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: unless-stopped
    networks:
      - so-net

  # Grafana: el datasource y el dashboard se cargan solos desde monitoring/grafana.
  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - so-net

networks:
  so-net:
    driver: bridge

# Datos que sobreviven a docker compose down
volumes:
  prometheus_data:
  grafana_data:
