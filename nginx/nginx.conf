# Formato de log del balanceo: muestra qué backend atendió cada petición y cuánto tardó.
log_format balanceo '$remote_addr "$request" estado=$status instancia=$upstream_addr tiempo=$request_time upstream_tiempo=$upstream_response_time';

# Grupo de backends. Round robin (método por defecto).
# "zone" comparte el turno del round robin entre los procesos worker de Nginx (reparto exacto 3/3/3).
# Tras 3 fallos seguidos, Nginx deja de usar ese backend durante 10 s y luego lo prueba otra vez.
upstream backends {
    zone backends 64k;
    # Nginx vuelve a preguntar la IP de cada backend al DNS de Docker cada 10 s:
    # así un backend recreado con otra IP sigue recibiendo tráfico.
    resolver 127.0.0.11 valid=10s ipv6=off;
    server backend1:5000 resolve max_fails=3 fail_timeout=10s;
    server backend2:5000 resolve max_fails=3 fail_timeout=10s;
    server backend3:5000 resolve max_fails=3 fail_timeout=10s;
}

# Servidor público (puerto 80 del contenedor, publicado en el 8080 del host).
server {
    listen 80;

    # Log con el formato de balanceo (la imagen oficial lo envía a stdout).
    access_log /var/log/nginx/access.log balanceo;

    location / {
        proxy_pass http://backends;

        # Cabeceras que el backend recibe sobre el cliente original.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Respuesta al cliente: IP:puerto del backend que atendió.
        add_header X-Upstream $upstream_addr always;

        # Si un backend no conecta en 2 s o falla, se reintenta en el siguiente.
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503;
    }
}

# Servidor de métricas internas (8081). No se publica al host; solo dentro de so-net.
server {
    listen 8081;

    access_log off;

    location /stub_status {
        stub_status;
    }
}
